
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            color: #262626;
            font-size: 12px;
        }

        .container {
            width: 350px;
            margin: 60px auto 0;
            text-align: center;
        }

        .login-box {
            border: 1px solid #dbdbdb;
            padding: 35px 35px 25px;
        }

        .logo {
            font-family: cursive;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            height: 36px;
            margin-bottom: 8px;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 11px;
        }

        button {
            width: 100%;
            height: 32px;
            margin-top: 8px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 22px 0;
            color: #8e8e8e;
            font-size: 11px;
        }

        .or::before,
        .or::after {
            content: "";
            height: 1px;
            background: #dbdbdb;
            flex: 1;
        }

        a {
            text-decoration: none;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
            font-size: 12px;
        }

        .forgot {
            display: block;
            margin-top: 22px;
            color: #00376b;
            font-size: 10px;
        }

        .signup-box {
            border: 1px solid #dbdbdb;
            padding: 22px;
            margin-top: 8px;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: bold;
        }

        .get-app {
            margin-top: 20px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            background: #000;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        footer {
            margin-top: 75px;
            text-align: center;
            color: #737373;
            font-size: 9px;
            line-height: 2.5;
        }

        footer a {
            color: #737373;
            margin: 0 8px;
        }

        .copyright {
            margin-top: 15px;
        }

        @media (max-width: 400px) {
            .container {
                width: 90%;
                margin-top: 30px;
            }

            footer {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">Instagram</div>

            <form onsubmit="return false;">

                <input type="text"
                    placeholder="Phone number, username, or email">

                <input type="password"
                    placeholder="Password">

                <button type="submit">Log In</button>

            </form>

            <div class="or">OR</div>

            <a href="#" class="facebook">
                Log in with Facebook
            </a>

            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>

        <div class="signup-box">
            Don't have an account?
            <a href="#">Sign up</a>
        </div>

        <div class="get-app">
            <p>Get the app.</p>

            <div class="badges">
                <div class="badge"> App Store</div>
                <div class="badge">▶ Google Play</div>
            </div>
        </div>

    </div>

    <footer>

        <div>
            <a href="#">ABOUT</a>
            <a href="#">HELP</a>
            <a href="#">PRESS</a>
            <a href="#">API</a>
            <a href="#">JOBS</a>
            <a href="#">PRIVACY</a>
            <a href="#">TERMS</a>
        </div>

        <div>
            <a href="#">LOCATIONS</a>
            <a href="#">LANGUAGE</a>
            <a href="#">META</a>
        </div>

        <div class="copyright">
            © 2026 INSTAGRAM FROM META
        </div>

    </footer>

</body>
</html>
