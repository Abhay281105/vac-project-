
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
}

.board {
    width: min(90vw, 600px);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    border: 3px solid #333;
    background: white;
}

/* Four home areas */
.home {
    grid-column: span 6;
    grid-row: span 6;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid #333;
}

.red {
    background: #e74c3c;
}

.yellow {
    background: #d4e34b;
}

.blue {
    background: #149ee8;
}

.green {
    background: #79df63;
}

/* Tokens area */
.tokens {
    width: 65%;
    aspect-ratio: 1;
    background: #eefcff;
    border: 4px solid white;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18%;
    padding: 12%;
}

.token {
    border: 2px solid rgba(0, 0, 0, 0.08);
}

/* Middle paths */
.path {
    border: 1px solid #aaa;
    background: #fff;
}

.red-path {
    background: #e74c3c;
}

.yellow-path {
    background: #d4e34b;
}

.blue-path {
    background: #149ee8;
}

.green-path {
    background: #79df63;
}

/* Center */
.center {
    grid-column: 7 / 10;
    grid-row: 7 / 10;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border: 1px solid #333;
}

.center div {
    border: 1px solid #333;
}

.center .red {
    background: #e74c3c;
}

.center .yellow {
    background: #d4e34b;
}

.center .blue {
    background: #149ee8;
}

.center .green {
    background: #79df63;
}

/* Board layout */
.home-red {
    grid-column: 1 / 7;
    grid-row: 1 / 7;
}

.home-yellow {
    grid-column: 10 / 16;
    grid-row: 1 / 7;
}

.home-blue {
    grid-column: 1 / 7;
    grid-row: 10 / 16;
}

.home-green {
    grid-column: 10 / 16;
    grid-row: 10 / 16;
}

.middle {
    grid-column: 7 / 10;
    grid-row: 1 / 16;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(15, 1fr);
}

.horizontal {
    grid-column: 1 / 16;
    grid-row: 7 / 10;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(3, 1fr);
}

.board > .middle {
    z-index: 1;
}

.board > .horizontal {
    z-index: 2;
}

@media (max-width: 400px) {
    .tokens {
        gap: 10%;
        padding: 10%;
    }
}
</style>
</head>

<body>

<div class="board">

    <!-- Red home -->
    <div class="home red home-red">
        <div class="tokens">
            <div class="token red"></div>
            <div class="token red"></div>
            <div class="token red"></div>
            <div class="token red"></div>
        </div>
    </div>

            <div class="token blue"></div>

        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>

        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>

        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>

        <div class="path"></div>
        <div class="path"></div>
        <div class="path"></div>

    <!-- Horizontal path -->
    <div class="horizontal">

</body>
</html>
